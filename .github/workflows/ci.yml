name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src evals tests scripts
      - name: Ruff
        run: ruff check src tests evals scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluation suite
        run: python -m unittest discover -s evals -v
      - name: Security gate
        run: python scripts/security_scan.py --json
      - name: Evidence generation
        run: python scripts/generate_evidence.py
      - name: Strict local CI contract
        run: python scripts/ci.py --strict
