[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engineering-sprint"
version = "0.2.0"
description = "Offline-first agent orchestration, evals, observability and hybrid RAG lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
  "PyJWT>=2.8",
]
security = [
  "pip-audit>=2.7",
]
embeddings = [
  "fastembed>=0.8",
  "psutil>=5.9",
]
observability = [
  "opentelemetry-sdk>=1.30",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"
production-rag = "production_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "evals"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
